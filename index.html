<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Checker</title>

<style>
  @font-face {
    font-family: "Netflix Sans";
    font-style: normal;
    font-weight: 100;
    font-display: swap;
    src: url("https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Th.woff2") format("woff2");
  }

  @font-face {
    font-family: "Netflix Sans";
    font-style: normal;
    font-weight: 300;
    font-display: swap;
    src: url("https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Lt.woff2") format("woff2");
  }

  @font-face {
    font-family: "Netflix Sans";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Rg.woff2") format("woff2");
  }

  @font-face {
    font-family: "Netflix Sans";
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url("https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Md.woff2") format("woff2");
  }

  @font-face {
    font-family: "Netflix Sans";
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url("https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Md.woff2") format("woff2");
  }

  @font-face {
    font-family: "Netflix Sans";
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url("https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Bd.woff2") format("woff2");
  }

  @font-face {
    font-family: "Netflix Sans";
    font-style: normal;
    font-weight: 900;
    font-display: swap;
    src: url("https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Blk.woff2") format("woff2");
  }

  html, body { height: 100%; margin: 0; background: #000; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Netflix Sans", sans-serif;
    color: #fff;
  }

  h1, input, button, #label, #crack-time {
    font-family: "Netflix Sans", sans-serif;
  }

  h1 {
    margin: 0 0 28px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    text-align: center;
  }

  .field { position: relative; width: min(380px, 85vw); }

  input {
    box-sizing: border-box;
    width: 100%;
    padding: 16px 52px 16px 18px;
    font-size: 17px;
    font-weight: 400;
    color: #fff;
    background: #0c0c0c;
    border: 1px solid #222;
    border-radius: 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }

  input::placeholder { color: #555; }
  input:focus { border-color: #444; box-shadow: 0 0 0 4px rgba(255,255,255,.05); }

  #toggle {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    padding: 0;
    color: #666;
    background: none;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    transition: color .2s, background .2s;
  }

  #toggle:hover { color: #fff; background: #1a1a1a; }

  #toggle svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #toggle .off { display: none; }
  #toggle.on .eye { display: none; }
  #toggle.on .off { display: block; }

  #bar {
    width: min(380px, 85vw);
    height: 4px;
    margin-top: 14px;
    background: #161616;
    border-radius: 4px;
    overflow: hidden;
  }

  #fill {
    height: 100%;
    width: 0;
    background: #444;
    border-radius: 4px;
    transition: width .25s ease, background .25s ease;
  }

  #label {
    margin-top: 12px;
    height: 20px;
    font-size: 14px;
    font-weight: 400;
    color: #777;
    letter-spacing: .01em;
  }

  /* Estimated cracking time */
  #crack-time {
    width: min(380px, 85vw);
    box-sizing: border-box;
    margin-top: 18px;
    padding: 17px 20px;
    background: #0c0c0c;
    border: 1px solid #252525;
    border-radius: 14px;
    text-align: center;
    color: #fff;
    font-size: 23px;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.5px;
    overflow-wrap: anywhere;
    transition: border-color .25s, color .25s;
  }

  #crack-time::before {
    content: "◷  ESTIMATED TIME TO CRACK";
    display: block;
    margin-bottom: 9px;
    color: #888;
    font-family: "Netflix Sans", sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
  }
</style>
</head>

<body>

  <h1>Password Strength Checker</h1>

  <div class="field">
    <input id="pw" type="password" placeholder="Type a password" autocomplete="off" spellcheck="false" autofocus>

    <button id="toggle" type="button" aria-label="Show password">
      <svg class="eye" viewBox="0 0 24 24">
        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>

      <svg class="off" viewBox="0 0 24 24">
        <path d="M3 3l18 18"/>
        <path d="M10.6 6.1A10.7 10.7 0 0112 6c6.4 0 10 6 10 6a17 17 0 01-3.2 3.9M6.6 7.6A16.6 16.6 0 002 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1"/>
        <path d="M9.9 9.9a3 3 0 004.2 4.2"/>
      </svg>
    </button>
  </div>

  <div id="bar">
    <div id="fill"></div>
  </div>

  <div id="label"></div>

  <div id="crack-time">—</div>

<script>
  const pw = document.getElementById('pw');
  const fill = document.getElementById('fill');
  const label = document.getElementById('label');
  const toggle = document.getElementById('toggle');
  const crackTime = document.getElementById('crack-time');

  const levels = [
    ['', 0, '#444'],
    ['Very weak', 20, '#e5484d'],
    ['Weak', 40, '#f76b15'],
    ['Fair', 60, '#f5d90a'],
    ['Strong', 80, '#46a758'],
    ['Very strong', 100, '#30d158']
  ];

  // Estimate password cracking time
  function estimateCrackTime(password) {
    if (!password) return '—';

    let pool = 0;

    if (/[a-z]/.test(password)) pool += 26;
    if (/[A-Z]/.test(password)) pool += 26;
    if (/[0-9]/.test(password)) pool += 10;
    if (/[^A-Za-z0-9]/.test(password)) pool += 33;

    const guesses = Math.pow(pool, password.length) / 2;
    const seconds = guesses / 1e10;

    if (seconds < 1) return 'Less than a second';

    if (seconds < 60)
      return `${Math.ceil(seconds)} seconds`;

    if (seconds < 3600)
      return `${Math.ceil(seconds / 60)} minutes`;

    if (seconds < 86400)
      return `${Math.ceil(seconds / 3600)} hours`;

    if (seconds < 31536000)
      return `${Math.ceil(seconds / 86400)} days`;

    if (seconds < 31536000000)
      return `${Math.ceil(seconds / 31536000)} years`;

    if (seconds < 31536000000000)
      return `${(seconds / 31536000).toFixed(0)} years`;

    return `${(seconds / 31536000).toExponential(2)} years`;
  }

  pw.addEventListener('input', () => {
    const v = pw.value;

    let s = 0;

    if (v.length) {
      if (v.length >= 8) s++;
      if (v.length >= 12) s++;
      if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++;
      if (/\d/.test(v)) s++;
      if (/[^A-Za-z0-9]/.test(v)) s++;

      if (s === 0) s = 1;
    }

    const [text, width, color] = levels[s];

    label.textContent = text;
    label.style.color = s ? color : '#777';

    fill.style.width = width + '%';
    fill.style.background = color;

    crackTime.textContent = estimateCrackTime(v);
    crackTime.style.borderColor = s ? color + '55' : '#252525';
  });

  toggle.addEventListener('click', () => {
    const show = pw.type === 'password';

    pw.type = show ? 'text' : 'password';

    toggle.classList.toggle('on', show);

    toggle.setAttribute(
      'aria-label',
      show ? 'Hide password' : 'Show password'
    );

    pw.focus();
  });
</script>

</body>
</html>
