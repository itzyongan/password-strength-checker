<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Strength</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; color: #fff; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .field, #bar, #label { position: relative; z-index: 1; }
  .field { position: relative; width: min(380px, 85vw); }
  input { box-sizing: border-box; width: 100%; padding: 16px 52px 16px 18px; font: inherit; font-size: 17px; color: #fff; background: #0c0c0c; border: 1px solid #222; border-radius: 14px; outline: none; transition: border-color .25s, box-shadow .25s; }
  input::placeholder { color: #555; }
  input:focus { border-color: #555; box-shadow: 0 0 0 4px rgba(255,255,255,.07); }
  #toggle { position: absolute; top: 50%; right: 8px; transform: translateY(-50%); width: 36px; height: 36px; display: grid; place-items: center; padding: 0; color: #666; background: none; border: 0; border-radius: 10px; cursor: pointer; transition: color .2s, background .2s, transform .2s cubic-bezier(.2,.8,.2,1); }
  #toggle:hover { color: #fff; background: #1a1a1a; transform: translateY(-50%) scale(1.12); }
  #toggle:active { transform: translateY(-50%) scale(.92); }
  #toggle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #toggle .off { display: none; }
  #toggle.on .eye { display: none; }
  #toggle.on .off { display: block; }
  #bar { width: min(380px, 85vw); height: 4px;  margin-top: 14px; background: #161616; border-radius: 4px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #444; border-radius: 4px; transition: width .25s ease, background .25s ease; }
  #label { margin-top: 12px; height: 20px; font-size: 14px; color: #777; letter-spacing: .01em; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div class="field">
    <input id="pw" type="password" placeholder="Type a password" autocomplete="off" spellcheck="false" autofocus>
    <button id="toggle" type="button" aria-label="Show password">
      <svg class="eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.1A10.7 10.7 0 0112 6c6.4 0 10 6 10 6a17 17 0 01-3.2 3.9M6.6 7.6A16.6 16.6 0 002 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>
    </button>
  </div>
  <div id="bar"><div id="fill"></div></div>
  <div id="label"></div>
<script>
  const pw = document.getElementById('pw'), fill = document.getElementById('fill'), label = document.getElementById('label'), toggle = document.getElementById('toggle');
  const levels = [
    ['', 0, '#444'],
    ['Very weak', 20, '#e5484d'],
    ['Weak', 40, '#f76b15'],
    ['Fair', 60, '#f5d90a'],
    ['Strong', 80, '#46a758'],
    ['Very strong', 100, '#30d158']
  ];
  pw.addEventListener('input', () => {
    const v = pw.value;
    let s = 0;
    if (v.length) {
      if (v.length >= 8) s++;
      if (v.length >= 12) s++;
      if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++;
      if (/\d/.test(v)) s++;
      if (/[^A-Za-z0-9]/.test(v)) s++;
      if (s === 0) s = 1;
    }
    const [text, width, color] = levels[s];
    label.textContent = text;
    label.style.color = s ? color : '#777';
    fill.style.width = width + '%';
    fill.style.background = color;
  });
  toggle.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    toggle.classList.toggle('on', show);
    toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    pw.focus();
  });

  // Mouse motion effect
  (() => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.getElementById('fx'), ctx = c.getContext('2d');
    let w, h, dpr;
    const resize = () => { dpr = window.devicePixelRatio || 1; w = innerWidth; h = innerHeight; c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    resize(); addEventListener('resize', resize);
    const m = { x: w / 2, y: h / 2, gx: w / 2, gy: h / 2, active: false };
    const dots = [];
    addEventListener('mousemove', e => {
      m.x = e.clientX; m.y = e.clientY; m.active = true;
      for (let i = 0; i < 2; i++) dots.push({ x: m.x, y: m.y, vx: (Math.random() - .5) * 1.2, vy: (Math.random() - .5) * 1.2, r: Math.random() * 2 + 1, life: 1 });
    });
    document.addEventListener('mouseleave', () => m.active = false);
    (function loop() {
      ctx.clearRect(0, 0, w, h);
      m.gx += (m.x - m.gx) * .08; m.gy += (m.y - m.gy) * .08;
      if (m.active) {
        const g = ctx.createRadialGradient(m.gx, m.gy, 0, m.gx, m.gy, 220);
        g.addColorStop(0, 'rgba(255,255,255,.10)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      }
      for (let i = dots.length - 1; i >= 0; i--) {
        const d = dots[i];
        d.x += d.vx; d.y += d.vy; d.life -= .02;
        if (d.life <= 0) { dots.splice(i, 1); continue; }
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r * d.life, 0, 6.2832);
        ctx.fillStyle = 'rgba(255,255,255,' + (d.life * .6) + ')'; ctx.fill();
      }
      requestAnimationFrame(loop);
    })();
  })();
</script>
</body>
</html>
